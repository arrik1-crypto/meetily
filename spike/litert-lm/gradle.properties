org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official

# The on-device LLM runtime under test.
#
# Found by the first CI run's discovery step, not guessed: Google's Maven
# group index for com.google.ai.edge.litertlm lists litertlm-android with
# releases up to 0.15.0. That is LiteRT-LM proper. The first attempt used
# com.google.mediapipe:tasks-genai, which is the older MediaPipe LLM
# Inference path — it resolves, but it is a different runtime and would have
# measured the wrong thing.
spike.llmCoordinate=com.google.ai.edge.litertlm:litertlm-android:0.15.0
