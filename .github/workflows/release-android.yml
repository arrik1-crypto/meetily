name: Release Android (signed AAB)

# Builds a Play-ready, signed App Bundle (and APK) from the upload keystore.
# Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64   - base64 of the .jks/.keystore upload key
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
# When the keystore secret is absent the job fails early with a hint, rather
# than silently shipping a debug-signed bundle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secret is present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add your"
            echo "::error::upload keystore + passwords as repository secrets first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/upload.keystore

      - name: Fetch sherpa-onnx native libs
        run: bash android/scripts/fetch_sherpa_libs.sh

      # ggml-cpu (llama.cpp v1.0.0) fetches Arm KleidiAI v1.32.0 at CMake configure
      # time for every arm64 build (:app and :native-v82). Keep one verified copy
      # and point FetchContent at it. FETCHCONTENT_SOURCE_DIR skips ggml's URL_HASH,
      # so the MD5 (ggml's pin) is checked here.
      - name: Cache KleidiAI source
        uses: actions/cache@v4
        with:
          path: ~/.cache/kleidiai
          key: kleidiai-v1.32.0-05f1953428ffe8e8c7f585dc6d508887
      - name: Fetch KleidiAI source
        run: |
          d=$HOME/.cache/kleidiai; mkdir -p "$d"; f=$d/kleidiai-v1.32.0-src.tar.gz
          [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" https://github.com/ARM-software/kleidiai/releases/download/v1.32.0/kleidiai-v1.32.0-src.tar.gz
          echo "05f1953428ffe8e8c7f585dc6d508887  $f" | md5sum -c -
          rm -rf "$d/kleidiai-v1.32.0" && tar -xzf "$f" -C "$d"
          echo "ORG_GRADLE_PROJECT_kleidiaiSourceDir=$d/kleidiai-v1.32.0" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed AAB and APK
        working-directory: android
        env:
          MEETILY_KEYSTORE_FILE: upload.keystore
          MEETILY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEETILY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEETILY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Two invocations: the Play bundle ships its native libraries
        # uncompressed (Play compresses downloads itself, and the device then
        # loads them in place rather than keeping an extracted second copy),
        # while the sideload APK keeps them compressed to stay small.
        # See packaging.jniLibs in app/build.gradle.kts.
        run: |
          ./gradlew --no-daemon -PuncompressedNativeLibs bundleRelease
          ./gradlew --no-daemon assembleRelease

      # Same check as build-android.yml, on the Play bundle too: the JNI
      # library (one per CPU level) must export its Java_ entry points and
      # nothing else. Also prints each library's size and lists the symbol
      # file uploaded below for each.
      - name: Check native library exports
        run: |
          python3 android/scripts/check_jni_exports.py \
            --symbols android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            android/app/build/outputs/bundle/release/*.aab \
            android/app/build/outputs/apk/release/*.apk

      # The symbols go along too: the bundle carries them for Play, but the
      # sideload APK does not, and with only Java_ entry points exported a
      # native crash in an exit report from that APK is pc + BuildId per
      # frame (see build-android.yml).
      - name: Upload signed bundle + APK
        uses: actions/upload-artifact@v4
        with:
          name: meetily-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android/upload.keystore
