name: Release Android (signed AAB)

# Builds a Play-ready, signed App Bundle (and APK) from the upload keystore.
# Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64   - base64 of the .jks/.keystore upload key
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
# When the keystore secret is absent the job fails early with a hint, rather
# than silently shipping a debug-signed bundle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secret is present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add your"
            echo "::error::upload keystore + passwords as repository secrets first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/upload.keystore

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed AAB and APK
        working-directory: android
        env:
          MEETILY_KEYSTORE_FILE: upload.keystore
          MEETILY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEETILY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEETILY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload signed bundle + APK
        uses: actions/upload-artifact@v4
        with:
          name: meetily-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android/upload.keystore
