name: Build LiteRT-LM spike

# Deliberately separate from build-android.yml, and NOT triggered by changes
# under android/. This is a throwaway measurement tool; it must never gate or
# slow the real app's pipeline.
on:
  push:
    branches:
      - "claude/**"
    paths:
      - "spike/**"
      - ".github/workflows/spike-litert.yml"
  workflow_dispatch:

# The build succeeded on run 3 but the publish step got a 403: the default
# token is read-only, and build-android.yml declares this while this workflow
# did not.
permissions:
  contents: write

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The whole reason this runs before the build: the published Kotlin
      # guide is not reachable, so the real class and method names are
      # unknown. Resolve the artifact, crack it open, and print the API.
      # Whatever the build does afterwards, the log carries the answer.
      - name: Discover on-device LLM artifacts on Google Maven
        continue-on-error: true
        run: |
          set +e
          base=https://dl.google.com/dl/android/maven2
          for group in \
            com/google/mediapipe \
            com/google/ai/edge/litert \
            com/google/ai/edge/litertlm \
            com/google/ai/edge
          do
            echo "=============================================="
            echo "group-index: ${group//\//.}"
            echo "=============================================="
            curl -fsSL "$base/$group/group-index.xml" || echo "  (no index)"
            echo
          done

      # The first run 404'd here because it assumed a .aar and guessed nothing
      # else. Read the POM for the real packaging, and fall back to .jar —
      # a silent 404 is how a discovery step produces no discovery.
      - name: Download and dump the artifact's API
        continue-on-error: true
        run: |
          set +e
          base=https://dl.google.com/dl/android/maven2
          coord=$(grep '^spike.llmCoordinate=' spike/litert-lm/gradle.properties | cut -d= -f2)
          echo "coordinate under test: $coord"
          g=$(echo "$coord" | cut -d: -f1 | tr '.' '/')
          a=$(echo "$coord" | cut -d: -f2)
          v=$(echo "$coord" | cut -d: -f3)
          dir="$base/$g/$a/$v"

          echo "--- POM (declares packaging and transitive deps) ---"
          curl -fsSL "$dir/$a-$v.pom" || echo "  (no pom)"
          echo

          got=""
          for ext in aar jar; do
            echo "trying $dir/$a-$v.$ext"
            if curl -fsSL -o "cand.$ext" "$dir/$a-$v.$ext"; then
              got="cand.$ext"
              echo "  got $got ($(stat -c%s "$got") bytes)"
              break
            fi
          done
          [ -z "$got" ] && { echo "no artifact downloadable at that coordinate"; exit 0; }

          mkdir -p aar && cd aar && unzip -o -q "../$got"
          echo "--- artifact contents ---"
          find . -maxdepth 2 | head -40

          # An AAR nests classes.jar; a plain jar is already the classes.
          jar=classes.jar
          [ -f "$jar" ] || jar="../$got"
          mkdir -p x && cd x && unzip -o -q "../$jar" 2>/dev/null

          echo "--- every top-level class (this is the API surface) ---"
          find . -name '*.class' | grep -v '\$' | sed 's|^\./||; s|\.class$||; s|/|.|g' | sort | head -80

          echo "--- public API of the classes that matter ---"
          for c in $(find . -name '*.class' | grep -viE '\$' | grep -iE 'Engine|LlmInference|Session|Backend|Config|Accelerator' | head -14); do
            cls=$(echo "${c#./}" | sed 's/\.class$//' | tr '/' '.')
            echo "=== $cls ==="
            javap -classpath . -public "$cls" 2>/dev/null | head -50
          done

          # THE CRUX. Backend turned out to be a sealed-style abstract class,
          # so the concrete backends are NESTED classes — which the filters
          # above deliberately exclude. Whether an NPU one exists is the single
          # fact this whole spike turns on, so list them explicitly.
          echo "--- Backend and its concrete subclasses ---"
          find . -name 'Backend*.class' | sed 's|^\./||; s|\.class$||; s|/|.|g' | sort
          for c in $(find . -name 'Backend*.class' | head -12); do
            cls=$(echo "${c#./}" | sed 's/\.class$//' | tr '/' '.')
            echo "=== $cls ==="
            javap -classpath . -public -constants "$cls" 2>/dev/null | head -25
          done

          # Corroborating evidence: vendor NPU runtimes ship as .so files. A
          # backend that exists in the API but has no native library behind it
          # is not one you can actually use.
          echo "--- native libraries shipped in the AAR ---"
          cd .. && ls -la jni/arm64-v8a 2>/dev/null || echo "  (no arm64 jni dir)"

      - name: Build spike APK
        id: build
        continue-on-error: true
        run: |
          chmod +x android/gradlew
          android/gradlew -p spike/litert-lm assembleDebug --no-daemon --stacktrace

      - name: Upload spike APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: litert-spike-apk
          path: spike/litert-lm/app/build/outputs/apk/debug/*.apk

      # Committed to the branch so it can be delivered the same way the real
      # builds are, rather than needing an artifact download.
      - name: Commit spike APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p spike/dist
          cp spike/litert-lm/app/build/outputs/apk/debug/*.apk spike/dist/litert-spike.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spike/dist/litert-spike.apk
          git diff --staged --quiet || git commit -m "ci: publish LiteRT spike APK [skip ci]"
          git push
