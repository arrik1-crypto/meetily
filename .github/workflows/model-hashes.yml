name: Model hashes

# Prints the Hugging Face commit and SHA-256 of every model the Android app
# downloads, for pinning into the catalogues' `revision` / `sha256` fields.
# Read-only: it never edits the catalogues.
on:
  push:
    branches: ['**']
    paths:
      - 'android/scripts/model_hashes.py'
      - '.github/workflows/model-hashes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Look up model revisions and hashes
        env:
          # Optional; raises Hugging Face API rate limits when configured.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 android/scripts/model_hashes.py
