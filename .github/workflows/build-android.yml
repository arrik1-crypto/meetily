name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/meeting-summarizer-android-apk-41ewdo
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: bash android/scripts/fetch_sherpa_libs.sh

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetily-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also commit the APK to android/dist/ on the development branch so it
      # can be fetched over git (some environments cannot reach the artifact
      # storage host). [skip ci] prevents retriggering this workflow.
      - name: Commit APK to branch
        if: github.ref == 'refs/heads/claude/meeting-summarizer-android-apk-41ewdo'
        run: |
          mkdir -p android/dist
          # ABI splits: publish the arm64 (real phone) APK to the branch;
          # the x86_64 emulator APK stays available as a workflow artifact.
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk android/dist/meetily-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/dist/meetily-android.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "ci: publish Android APK build [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
