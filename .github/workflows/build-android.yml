name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/meeting-summarizer-android-apk-41ewdo
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: bash android/scripts/fetch_sherpa_libs.sh
        env:
          # Authenticates the release-API fallback path (the direct asset
          # URL needs no auth); avoids anonymous rate limits on runners.
          GH_TOKEN: ${{ github.token }}

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      # Without a keystore, AGP signs with a debug key that it GENERATES FRESH
      # on every ephemeral runner — so each build carries a different
      # certificate and Android refuses to install it over the previous one
      # ("App not installed"). Decoding the stored keystore makes every build
      # share one identity, so sideloaded updates install in place.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload.keystore
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Signed with the stored keystore: updates install in place."
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway debug key generated on this runner. It CANNOT be installed over an existing build (generic install error); the app must be uninstalled first, which erases its data. Add the ANDROID_KEYSTORE_* secrets to fix this permanently."
          fi

      - name: Build release APK
        working-directory: android
        env:
          # Ignored by the gradle config when the file is absent, in which case
          # it falls back to the debug key (see app/build.gradle.kts).
          MEETILY_KEYSTORE_FILE: upload.keystore
          MEETILY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEETILY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEETILY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f android/upload.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetily-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also commit the APK to android/dist/ on the development branch so it
      # can be fetched over git (some environments cannot reach the artifact
      # storage host). [skip ci] prevents retriggering this workflow.
      - name: Commit APK to branch
        if: github.ref == 'refs/heads/claude/meeting-summarizer-android-apk-41ewdo'
        run: |
          mkdir -p android/dist
          # ABI splits: publish the arm64 (real phone) APK to the branch;
          # the x86_64 emulator APK stays available as a workflow artifact.
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk android/dist/meetily-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/dist/meetily-android.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "ci: publish Android APK build [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
